<svg xmlns="http://www.w3.org/2000/svg" width="440" height="695" viewBox="0 0 440 695" role="img" aria-labelledby="title desc"><title id="title">고정한 쌍과 모든 쌍은 다르다</title><desc id="desc">16개 균등한 이진 2×2 행렬을 두 격자로 비교한다. 차이 01을 먼저 고정하면 충돌하는 행렬은 파랑 4개이다. 어떤 비영 차이라도 충돌하면 세는 조건에서는 특이 행렬 10개가 주황이다. 각 축은 두 공개 행이다.</desc>
<rect width="440" height="695" rx="12" fill="#fff"/>
<g font-family="system-ui,sans-serif">
<text x="20" y="35" font-size="22" fill="#0f172a" text-anchor="start">고정한 쌍과 모든 쌍은 다르다</text>
<text x="20" y="65" font-size="17" fill="#0f172a" text-anchor="start">n = k = 2;  16 equally likely H</text>
<text x="20" y="100" font-size="21" fill="#1d4ed8" text-anchor="start">고정 δ=01: 4/16</text>
