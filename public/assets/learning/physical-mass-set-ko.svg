<title id="title">역변환은 무한한 상한을 남길 수 있습니다</title><desc id="desc">추가 힘2N에 대해 가속도 차이 구간0.8..1.2,-0.2..0.2,-1..-0.1을 질량 집합5/3..5/2,10이상,공집합으로 역변환한다. 반직선의 화살표는 유한 상한이 없음을 뜻한다.</desc>
