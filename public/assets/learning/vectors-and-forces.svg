<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description">
  <title id="title">Adding two perpendicular force vectors</title>
  <desc id="description">In force-component coordinates, F1 is 3 newtons along x and F2 is 4 newtons along y. The net force is the diagonal with components 3 and 4 and magnitude 5 newtons. A translated copy of F2 shows head-to-tail addition. All z components are zero.</desc>
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker>
    <marker id="f2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#175cd3"/></marker>
    <marker id="net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#067647"/></marker>
  </defs>
  <rect width="640" height="420" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="638" height="418" rx="15" fill="none" stroke="#cbd5e1"/>
  <g fill="none" stroke="#e2e8f0" stroke-width="1">
    <path d="M80 60H320 M80 120H320 M80 180H320 M80 240H320 M140 40V300 M200 40V300 M260 40V300"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#axis)">
    <path d="M60 300H350"/><path d="M80 320V30"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#334155">
    <text x="63" y="323">0</text><text x="137" y="323">1</text><text x="197" y="323">2</text><text x="257" y="323">3</text>
    <text x="58" y="245">1</text><text x="58" y="185">2</text><text x="58" y="125">3</text><text x="58" y="65">4</text>
    <text x="354" y="306">x (N)</text><text x="66" y="22">y (N)</text>
  </g>
  <path d="M80 300H260" fill="none" stroke="#b42318" stroke-width="4" marker-end="url(#f1)"/>
  <path d="M80 300V60" fill="none" stroke="#175cd3" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#f2)"/>
  <path d="M260 300V60" fill="none" stroke="#175cd3" stroke-width="3" marker-end="url(#f2)"/>
  <path d="M80 300L260 60" fill="none" stroke="#067647" stroke-width="4" marker-end="url(#net)"/>
  <path d="M244 300V284H260" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#172b4d">
    <text x="135" y="350">F1 = (3, 0, 0) N</text>
    <text x="295" y="180">F2 = (0, 4, 0) N</text>
    <text x="305" y="68" font-weight="bold">Fnet = (3, 4, 0) N</text>
    <text x="305" y="98">|Fnet| = 5 N</text>
    <text x="305" y="128">z = 0</text>
    <text x="80" y="390">Fnet = F1 + F2</text>
  </g>
</svg>
