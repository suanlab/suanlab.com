<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">겹치지 않는 16개의 Hamming 공</title><desc id="desc">각 타일은 중심 부호어 하나와 7개 단일 오류 이웃을 포함한다. 위치 1부터 읽은 16개 중심의 공은 서로 겹치지 않고 128개 수신열을 모두 덮는다.</desc>
