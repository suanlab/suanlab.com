<title id="title">Euclidean 사영이 운동에너지를 늘릴 수 있습니다</title><desc id="desc">고정q=(3/5,4/5),질량행렬diag(1,4)에서 초기속도(1,0)와 두 접선 사영을 속도 공간에 그렸다. Euclidean 사영은 초기 운동에너지 타원 밖, 질량 사영은 안에 있다.</desc>
