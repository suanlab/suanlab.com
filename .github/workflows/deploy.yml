name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for textbook exercises
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/learning/requirements-ci.txt

      - name: Install textbook exercise dependencies
        run: python -m pip install -r scripts/learning/requirements-ci.txt

      - name: Validate and build
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/site-validation.log"

      - name: Report validation failures
        if: failure()
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'site-validation.log'
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              failures = [i for i, line in enumerate(lines) if re.match(r'\s*(?:not ok\b|✖)', line) or re.search(r'error TS\d+|Error:|AssertionError', line)]
              if not failures:
                  failures = [max(0, len(lines) - 30)]
              for index in failures[:25]:
                  message = '\n'.join(lines[max(0, index - 2):index + 25])[:6000] or 'Validation failed before producing log output.'
                  escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Site validation failed::{escaped}')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### Site validation failures\n\n```text\n')
                  summary.write('\n'.join(lines[i] for i in failures[:50] if i < len(lines)).replace('```', "'''"))
                  summary.write('\n```\n')
          PY

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
